name: Remove Claude References
on:
  workflow_dispatch:

# 1. CRITICAL: Grants the runner permission to force-push changes back to your repo
permissions:
  contents: write

jobs:
  rewrite-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

      - name: Strip Claude from Commit Messages
        run: |
          # Bypasses the modern Git warning that can halt the action
          export FILTER_BRANCH_SHTDN_ALLOW_EMPTY=1
          
          # Broadened pattern: deletes any line containing "Claude", "Sonnet", or "Co-authored-by" variants case-insensitively
          git filter-branch -f --msg-filter '
            sed -E "/[Cc]laude|[Ss]onnet/d"
          ' -- --all

      - name: Force Push Cleaned History
        run: |
          git push origin --force --all
          git push origin --force --tags
